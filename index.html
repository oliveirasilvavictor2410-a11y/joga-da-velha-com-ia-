<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha com IA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti para efeito de vitória -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                        playerX: '#06b6d4', // Cyan
                        playerO: '#f43f5e', // Rose
                        accent: '#8b5cf6', // Violet
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .glass-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .glass-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        /* Efeitos das Células */
        .cell {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .cell:hover:not(.occupied):not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        /* Animação dos Símbolos X e O */
        .symbol-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-15deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* Linha Vencedora Estilizada */
        .winning-line {
            position: absolute;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6, #f43f5e);
            border-radius: 9999px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.8);
            z-index: 20;
            transition: all 0.4s ease-in-out;
            pointer-events: none;
        }

        /* Seleção de Abas/Botões Ativos */
        .active-tab {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(6, 182, 212, 0.8)) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between items-center p-4 min-h-screen selection:bg-violet-500 selection:text-white">

    <!-- Cabeçalho / Título -->
    <header class="text-center my-4">
        <h1 class="font-outfit text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-rose-400">
            JOGO DA VELHA
        </h1>
        <p class="text-slate-400 text-sm md:text-base mt-1 font-medium">Desafie a IA imbatível ou um amigo!</p>
    </header>

    <!-- Contêiner Principal -->
    <main class="w-full max-w-md glass-panel rounded-3xl p-5 md:p-6 my-auto flex flex-col gap-5">

        <!-- Modos de Jogo -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/60 rounded-xl border border-white/5">
            <button id="btnModeVsAi" onclick="setGameMode('vsAi')" class="glass-btn active-tab py-2 px-3 rounded-lg font-semibold text-xs sm:text-sm flex items-center justify-center gap-2">
                <i class="fa-solid font-bold fa-robot"></i> Humano vs IA
            </button>
            <button id="btnModeVsHuman" onclick="setGameMode('vsHuman')" class="glass-btn text-slate-400 py-2 px-3 rounded-lg font-semibold text-xs sm:text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-group"></i> 2 Jogadores
            </button>
        </div>

        <!-- Painel de Configurações da IA (Apenas no modo vs IA) -->
        <div id="aiSettingsPanel" class="flex flex-col gap-3">
            <!-- Nível de Dificuldade -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Dificuldade da IA</label>
                <div class="grid grid-cols-3 gap-2">
                    <button id="diffEasy" onclick="setDifficulty('easy')" class="glass-btn text-slate-300 py-1.5 rounded-lg text-xs font-semibold">
                        Fácil
                    </button>
                    <button id="diffMedium" onclick="setDifficulty('medium')" class="glass-btn text-slate-300 py-1.5 rounded-lg text-xs font-semibold">
                        Médio
                    </button>
                    <button id="diffImpossible" onclick="setDifficulty('impossible')" class="glass-btn active-tab py-1.5 rounded-lg text-xs font-semibold">
                        Impossível
                    </button>
                </div>
            </div>

            <!-- Seleção de Símbolo (X ou O) -->
            <div class="flex items-center justify-between bg-slate-900/40 p-2.5 rounded-xl border border-white/5">
                <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Seu Símbolo:</span>
                <div class="flex gap-2">
                    <button id="symbolX" onclick="setUserSymbol('X')" class="glass-btn active-tab px-4 py-1 rounded-lg font-bold text-cyan-400 text-sm">
                        X
                    </button>
                    <button id="symbolO" onclick="setUserSymbol('O')" class="glass-btn text-slate-400 px-4 py-1 rounded-lg font-bold text-rose-400 text-sm">
                        O
                    </button>
                </div>
            </div>
        </div>

        <!-- Placar -->
        <div class="grid grid-cols-3 gap-3 text-center bg-slate-900/80 p-3 rounded-2xl border border-white/5">
            <div class="flex flex-col items-center">
                <span id="labelScoreP1" class="text-xs font-medium text-cyan-400 truncate max-w-[90px]">Jogador (X)</span>
                <span id="scoreP1" class="text-2xl font-extrabold text-white font-outfit mt-0.5">0</span>
            </div>
            <div class="flex flex-col items-center border-x border-slate-700/50 px-2">
                <span class="text-xs font-medium text-slate-400">Empates</span>
                <span id="scoreTies" class="text-2xl font-extrabold text-slate-300 font-outfit mt-0.5">0</span>
            </div>
            <div class="flex flex-col items-center">
                <span id="labelScoreP2" class="text-xs font-medium text-rose-400 truncate max-w-[90px]">IA (O)</span>
                <span id="scoreP2" class="text-2xl font-extrabold text-white font-outfit mt-0.5">0</span>
            </div>
        </div>

        <!-- Status do Turno / Mensagem de Fim -->
        <div id="statusText" class="text-center text-sm font-semibold text-slate-300 h-6 flex items-center justify-center gap-2">
            Sua vez de jogar!
        </div>

        <!-- Tabuleiro do Jogo -->
        <div class="relative w-full aspect-square max-w-[320px] mx-auto">
            <!-- Grade do Tabuleiro -->
            <div id="board" class="grid grid-cols-3 gap-2.5 w-full h-full p-2 bg-slate-900/90 rounded-2xl border border-white/10 shadow-inner">
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="0"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="1"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="2"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="3"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="4"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="5"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="6"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="7"></button>
                <button class="cell rounded-xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold" data-index="8"></button>
            </div>
            <!-- Elemento de Linha Vencedora -->
            <div id="winningLine" class="winning-line opacity-0"></div>
        </div>

        <!-- Controles de Ação -->
        <div class="flex gap-3 mt-1">
            <button onclick="resetBoard()" class="glass-btn flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider text-slate-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar Rodada
            </button>
            <button onclick="resetScores()" class="glass-btn py-2.5 px-4 rounded-xl font-bold text-xs uppercase tracking-wider text-rose-400 hover:text-rose-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-trash-can"></i> Zerar Placar
            </button>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center text-slate-500 text-xs my-4">
        Desenvolvido com HTML, Tailwind CSS & JavaScript
    </footer>

    <!-- Lógica em JavaScript -->
    <script>
        // ESTADO DO JOGO
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let gameMode = 'vsAi'; // 'vsAi' ou 'vsHuman'
        let aiDifficulty = 'impossible'; // 'easy', 'medium', 'impossible'
        let humanSymbol = 'X';
        let aiSymbol = 'O';
        let currentPlayer = 'X'; // Sempre 'X' começa por padrão

        // Placares
        let scores = {
            P1: 0,
            P2: 0,
            ties: 0
        };

        // Combinações Vencedoras
        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        // Elementos DOM
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('statusText');
        const winningLineEl = document.getElementById('winningLine');
        const aiSettingsPanel = document.getElementById('aiSettingsPanel');
        const labelScoreP1 = document.getElementById('labelScoreP1');
        const labelScoreP2 = document.getElementById('labelScoreP2');

        // INICIALIZAÇÃO
        window.addEventListener('DOMContentLoaded', () => {
            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            updateLabels();
            resetBoard();
        });

        // TROCA DE MODO DE JOGO
        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('btnModeVsAi').classList.toggle('active-tab', mode === 'vsAi');
            document.getElementById('btnModeVsAi').classList.toggle('text-slate-400', mode !== 'vsAi');
            document.getElementById('btnModeVsHuman').classList.toggle('active-tab', mode === 'vsHuman');
            document.getElementById('btnModeVsHuman').classList.toggle('text-slate-400', mode !== 'vsHuman');

            if (mode === 'vsAi') {
                aiSettingsPanel.classList.remove('hidden');
            } else {
                aiSettingsPanel.classList.add('hidden');
            }

            resetScores();
            updateLabels();
            resetBoard();
        }

        // DIFICULDADE DA IA
        function setDifficulty(diff) {
            aiDifficulty = diff;
            ['Easy', 'Medium', 'Impossible'].forEach(d => {
                const btn = document.getElementById(`diff${d}`);
                const isSelected = d.toLowerCase() === diff;
                btn.classList.toggle('active-tab', isSelected);
                btn.classList.toggle('text-slate-300', !isSelected);
            });
            resetBoard();
        }

        // ESCOLHA DO SÍMBOLO
        function setUserSymbol(symbol) {
            humanSymbol = symbol;
            aiSymbol = symbol === 'X' ? 'O' : 'X';

            document.getElementById('symbolX').classList.toggle('active-tab', symbol === 'X');
            document.getElementById('symbolX').classList.toggle('text-slate-400', symbol !== 'X');
            document.getElementById('symbolO').classList.toggle('active-tab', symbol === 'O');
            document.getElementById('symbolO').classList.toggle('text-slate-400', symbol !== 'O');

            updateLabels();
            resetBoard();
        }

        // ATUALIZA RÓTULOS DOS PLACARES E STATUS
        function updateLabels() {
            if (gameMode === 'vsAi') {
                labelScoreP1.textContent = `Você (${humanSymbol})`;
                labelScoreP2.textContent = `IA (${aiSymbol})`;
            } else {
                labelScoreP1.textContent = `Jogador 1 (X)`;
                labelScoreP2.textContent = `Jogador 2 (O)`;
            }
        }

        // JOGADA DO JOGADOR
        function handleCellClick(e) {
            const cell = e.target;
            const index = parseInt(cell.getAttribute('data-index'));

            if (boardState[index] !== '' || !gameActive) return;

            // Bloqueia clique do humano durante a vez da IA
            if (gameMode === 'vsAi' && currentPlayer !== humanSymbol) return;

            makeMove(index, currentPlayer);

            if (gameActive && gameMode === 'vsAi' && currentPlayer === aiSymbol) {
                // Pequeno atraso para parecer raciocínio da IA
                setTimeout(triggerAiMove, 400);
            }
        }

        // EXECUTA MOVIMENTO NO TABULEIRO
        function makeMove(index, symbol) {
            boardState[index] = symbol;
            const cell = cells[index];
            
            cell.classList.add('occupied');
            
            // Criar e inserir elemento do símbolo formatado
            const symbolSpan = document.createElement('span');
            symbolSpan.className = `symbol-pop ${symbol === 'X' ? 'text-playerX' : 'text-playerO'}`;
            symbolSpan.textContent = symbol;
            cell.appendChild(symbolSpan);

            const result = checkWin(boardState);

            if (result) {
                endGame(result);
            } else if (boardState.every(cell => cell !== '')) {
                endGame({ winner: 'tie' });
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        // ATUALIZA MENSAGEM DE STATUS
        function updateStatus() {
            if (!gameActive) return;

            if (gameMode === 'vsAi') {
                if (currentPlayer === humanSymbol) {
                    statusText.innerHTML = `<span class="text-cyan-400"><i class="fa-solid fa-user"></i> Sua vez!</span>`;
                } else {
                    statusText.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-robot animate-bounce"></i> IA pensando...</span>`;
                }
            } else {
                const color = currentPlayer === 'X' ? 'text-cyan-400' : 'text-rose-400';
                statusText.innerHTML = `<span class="${color}">Vez do Jogador ${currentPlayer}</span>`;
            }
        }

        // CHECA CONDIÇÃO DE VITÓRIA
        function checkWin(board) {
            for (let i = 0; i < winningCombinations.length; i++) {
                const [a, b, c] = winningCombinations[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combo: [a, b, c], index: i };
                }
            }
            return null;
        }

        // FINALIZA O JOGO
        function endGame(result) {
            gameActive = false;

            if (result.winner === 'tie') {
                statusText.innerHTML = `<span class="text-amber-400 font-bold"><i class="fa-solid fa-handshake"></i> Empate!</span>`;
                scores.ties++;
                document.getElementById('scoreTies').textContent = scores.ties;
            } else {
                const isWinnerP1 = (gameMode === 'vsAi' && result.winner === humanSymbol) || (gameMode === 'vsHuman' && result.winner === 'X');

                if (isWinnerP1) {
                    scores.P1++;
                    document.getElementById('scoreP1').textContent = scores.P1;
                    const name = gameMode === 'vsAi' ? 'Você' : 'Jogador 1';
                    statusText.innerHTML = `<span class="text-cyan-400 font-bold"><i class="fa-solid fa-trophy"></i> ${name} venceu!</span>`;
                    triggerConfetti();
                } else {
                    scores.P2++;
                    document.getElementById('scoreP2').textContent = scores.P2;
                    const name = gameMode === 'vsAi' ? 'A IA' : 'Jogador 2';
                    statusText.innerHTML = `<span class="text-rose-400 font-bold"><i class="fa-solid fa-crown"></i> ${name} venceu!</span>`;
                }

                drawWinningLine(result.combo);
            }
        }

        // DESENHA A LINHA VENCEDORA CORTANDO OS SÍMBOLOS
        function drawWinningLine(combo) {
            const firstCell = cells[combo[0]];
            const lastCell = cells[combo[2]];

            const boardRect = document.getElementById('board').getBoundingClientRect();
            const firstRect = firstCell.getBoundingClientRect();
            const lastRect = lastCell.getBoundingClientRect();

            const x1 = firstRect.left + firstRect.width / 2 - boardRect.left;
            const y1 = firstRect.top + firstRect.height / 2 - boardRect.top;
            const x2 = lastRect.left + lastRect.width / 2 - boardRect.left;
            const y2 = lastRect.top + lastRect.height / 2 - boardRect.top;

            const distance = Math.hypot(x2 - x1, y2 - y1);
            const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

            winningLineEl.style.width = `${distance}px`;
            winningLineEl.style.height = `6px`;
            winningLineEl.style.left = `${x1}px`;
            winningLineEl.style.top = `${y1 - 3}px`;
            winningLineEl.style.transformOrigin = `0% 50%`;
            winningLineEl.style.transform = `rotate(${angle}deg)`;
            winningLineEl.style.opacity = '1';
        }

        // EFEITO VISUAL DE CONFETES
        function triggerConfetti() {
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.7 }
            });
        }

        // RESETAR SOMENTE O TABULEIRO
        function resetBoard() {
            boardState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X'; // 'X' sempre inicia a partida

            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('occupied');
            });

            winningLineEl.style.opacity = '0';
            winningLineEl.style.width = '0px';

            updateStatus();

            // Se for modo IA e IA for X (ou seja, Humano escolheu O), IA começa jogando
            if (gameMode === 'vsAi' && humanSymbol === 'O') {
                setTimeout(triggerAiMove, 500);
            }
        }

        // ZERAR PLACAR
        function resetScores() {
            scores.P1 = 0;
            scores.P2 = 0;
            scores.ties = 0;
            document.getElementById('scoreP1').textContent = '0';
            document.getElementById('scoreP2').textContent = '0';
            document.getElementById('scoreTies').textContent = '0';
            resetBoard();
        }

        // ==========================================
        // INTELIGÊNCIA ARTIFICIAL (IA)
        // ==========================================

        function triggerAiMove() {
            if (!gameActive) return;

            let bestIndex;

            if (aiDifficulty === 'easy') {
                bestIndex = getRandomMove();
            } else if (aiDifficulty === 'medium') {
                // 50% de chance de jogada perfeita, 50% aleatória
                bestIndex = Math.random() < 0.5 ? minimax(boardState, aiSymbol).index : getRandomMove();
            } else {
                // Dificuldade Impossível (Minimax Completo)
                bestIndex = minimax(boardState, aiSymbol).index;
            }

            if (bestIndex !== undefined && bestIndex !== null) {
                makeMove(bestIndex, aiSymbol);
            }
        }

        // JOGADA ALEATÓRIA (FÁCIL)
        function getRandomMove() {
            const available = boardState
                .map((val, idx) => val === '' ? idx : null)
                .filter(val => val !== null);
            
            if (available.length === 0) return null;
            return available[Math.floor(Math.random() * available.length)];
        }

        // ALGORITMO MINIMAX (IMBATÍVEL)
        function minimax(newBoard, player) {
            const availSpots = newBoard
                .map((val, idx) => val === '' ? idx : null)
                .filter(val => val !== null);

            const winResult = checkWin(newBoard);

            if (winResult) {
                if (winResult.winner === aiSymbol) return { score: 10 };
                if (winResult.winner === humanSymbol) return { score: -10 };
            } else if (availSpots.length === 0) {
                return { score: 0 };
            }

            const moves = [];

            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === aiSymbol) {
                    const result = minimax(newBoard, humanSymbol);
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, aiSymbol);
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = '';
                moves.push(move);
            }

            let bestMove;
            if (player === aiSymbol) {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }

            return moves[bestMove];
        }
    </script>
</body>
</html>
